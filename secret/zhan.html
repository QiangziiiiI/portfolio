<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>志强 · 日常</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A66C2'/%3E%3Ctext x='32' y='45' font-size='34' font-weight='700' text-anchor='middle' fill='white' font-family='PingFang SC,Microsoft YaHei,sans-serif'%3E志%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   志强 · 日常 — 最终版
   设计系统：Win11 蓝 · 全局工具条 · 分组文字导航 · 组件化
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--t1);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::selection{background:var(--accent);color:#fff}

:root{
  color-scheme:light dark;
  --bg:#F6F7F8;--bg-2:#F0F1F3;
  --surface:#FFFFFF;--surface-2:#FAFBFC;--hover:#F0F1F4;--press:#E4E6EA;
  --border:#E7E8EC;--border-2:#D4D6DB;
  --t1:#16181D;--t2:#484D55;--t3:#8B909A;--t4:#B9BDC5;
  --accent:#0A66C2;--accent-2:#0A5AAC;--accent-bg:#EBF3FB;--accent-line:rgba(10,102,194,.28);
  --green:#0F7B3D;--green-bg:#E9F7EF;--green-line:rgba(15,123,61,.22);
  --orange:#B4550D;--orange-bg:#FDF3E7;--orange-line:rgba(180,85,13,.2);
  --red:#C22F2F;--red-bg:#FCEEEE;--red-line:rgba(194,47,47,.18);
  --blue:#0A66C2;--blue-bg:#EBF3FB;
  --fs-1:12px;--fs-2:13px;--fs-3:14px;--fs-4:15px;--fs-5:18px;--fs-6:24px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:32px;
  --r-s:6px;--r:10px;--r-l:14px;
  --sidebar-w:250px;--topbar-h:56px;
  --ease:cubic-bezier(.16,1,.3,1);
  --t:220ms var(--ease);--t-fast:140ms var(--ease);
  --sh-1:0 1px 2px rgba(15,18,25,.05);
  --sh-2:0 6px 20px rgba(15,18,25,.08);
  --sh-3:0 16px 48px rgba(15,18,25,.14);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#181A1F;--bg-2:#1E2026;
    --surface:#22242B;--surface-2:#282B33;--hover:#2E313A;--press:#363943;
    --border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.14);
    --t1:#F2F3F5;--t2:#B4B8C1;--t3:#7E838E;--t4:#565B66;
    --accent:#5CB3FF;--accent-2:#7EC4FF;--accent-bg:rgba(92,179,255,.12);--accent-line:rgba(92,179,255,.3);
    --green:#4FC582;--green-bg:rgba(79,197,130,.12);--green-line:rgba(79,197,130,.28);
    --orange:#FFB454;--orange-bg:rgba(255,180,84,.12);--orange-line:rgba(255,180,84,.28);
    --red:#FF8A80;--red-bg:rgba(255,138,128,.12);--red-line:rgba(255,138,128,.28);
    --blue:#5CB3FF;--blue-bg:rgba(92,179,255,.12);
    --sh-1:0 1px 2px rgba(0,0,0,.35);--sh-2:0 6px 20px rgba(0,0,0,.42);--sh-3:0 16px 48px rgba(0,0,0,.55);
  }
}

/* ===== 顶栏 ===== */
.topbar{
  position:fixed;top:0;left:var(--sidebar-w);right:0;z-index:200;height:var(--topbar-h);
  display:flex;align-items:center;gap:var(--sp-3);
  padding:0 var(--sp-5);
  background:var(--surface);border-bottom:1px solid var(--border);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  transition:left var(--t);
}
.menu-btn{width:34px;height:34px;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;color:var(--t2);transition:background var(--t-fast),color var(--t-fast);flex-shrink:0}
.menu-btn:hover{background:var(--hover);color:var(--t1)}
.brand{display:flex;align-items:center;gap:var(--sp-2);white-space:nowrap}
.brand-name{font-size:var(--fs-3);font-weight:600;color:var(--t1);letter-spacing:-.2px}
.topbar-title{font-size:var(--fs-4);font-weight:600;color:var(--t1);white-space:nowrap;letter-spacing:-.2px}
.topbar-title::before{content:'';display:inline-block;width:1px;height:18px;background:var(--border-2);vertical-align:middle;margin-right:var(--sp-3)}
.search-wrap{flex:1;position:relative;max-width:420px;margin-left:auto;background:var(--surface-2);border:1px solid transparent;border-radius:var(--r);transition:all var(--t)}
.search-wrap:hover{background:var(--hover)}
.search-wrap:focus-within{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-line)}
.search-wrap input{width:100%;height:38px;padding:0 var(--sp-4) 0 38px;border:none;border-radius:var(--r);font-size:var(--fs-2);background:transparent;color:var(--t1)}
.search-wrap input:focus{outline:none}
.search-wrap input::placeholder{color:var(--t3)}
.search-wrap svg{position:absolute;left:var(--sp-3);top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.search-kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--t3);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:1px 7px;pointer-events:none}
.topbar-right{display:flex;align-items:center;gap:var(--sp-3);margin-left:var(--sp-3);flex-shrink:0}
.topbar-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);font-size:var(--fs-1);color:var(--t3);white-space:nowrap}
.topbar-badge .bdot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.topbar-badge b{color:var(--accent);font-weight:600}
.topbar-clock{font-size:var(--fs-2);font-weight:600;color:var(--t1);letter-spacing:.5px;margin-right:2px}
.topbar-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#0A66C2,#5CB3FF);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:var(--sh-1)}

/* ===== 布局 ===== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);position:fixed;top:0;left:0;bottom:0;z-index:300;
  background:var(--bg-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:var(--sp-5) var(--sp-3);
  transition:width var(--t),padding var(--t),border var(--t);overflow:hidden;
}
.sidebar.collapsed{width:0;padding:0;border:none}
.side-title{font-size:var(--fs-4);font-weight:700;color:var(--t1);padding:0 var(--sp-3) var(--sp-5);letter-spacing:-.3px;white-space:nowrap}
.side-title small{display:block;font-size:var(--fs-1);font-weight:500;color:var(--t3);margin-top:2px}
.nav-group{font-size:11px;font-weight:600;color:var(--t3);padding:var(--sp-4) var(--sp-3) var(--sp-2);letter-spacing:.8px;text-transform:uppercase}
.nav-group:first-of-type{padding-top:var(--sp-2)}
.nav-item{display:flex;align-items:center;width:100%;padding:10px var(--sp-4);border-radius:var(--r-s);margin-bottom:1px;font-size:var(--fs-3);font-weight:500;color:var(--t2);position:relative;transition:background var(--t-fast),color var(--t-fast)}
.nav-item:hover{background:var(--hover);color:var(--t1)}
.nav-item:active{background:var(--press)}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.side-spacer{flex:1}
.side-user{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#0A66C2,#5CB3FF);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.side-user-name{font-size:var(--fs-2);font-weight:600;color:var(--t1)}
.side-user-status{font-size:11px;color:var(--t3)}
.main{flex:1;margin-left:var(--sidebar-w);display:flex;justify-content:center;transition:margin-left var(--t);padding-top:var(--topbar-h)}
.main.expanded{margin-left:0}
.main.expanded .topbar{left:0}
.main-inner{max-width:1200px;width:100%;padding:var(--sp-6) 44px 120px;position:relative;z-index:1}

/* ===== 状态行 ===== */
.status-row{display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-6);flex-wrap:wrap}
.status-date{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-4);font-weight:700;color:var(--t1)}
.status-week{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);padding:3px 10px;border-radius:5px}
.status-text{font-size:var(--fs-2);color:var(--t2)}
.status-text b{color:var(--accent);font-weight:600}
.status-updated{margin-left:auto;font-size:var(--fs-1);color:var(--t3)}

/* ===== 指标 ===== */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);margin-bottom:var(--sp-6)}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:var(--sp-5);cursor:pointer;box-shadow:var(--sh-1);transition:all var(--t)}
.stat-card:hover{border-color:var(--border-2);box-shadow:var(--sh-2);transform:translateY(-2px)}
.stat-card:active{transform:scale(.985)}
.stat-num{font-size:30px;font-weight:700;letter-spacing:-1.4px;line-height:1.1;color:var(--t1);font-variant-numeric:tabular-nums;display:inline-block;transition:transform .5s var(--ease)}
.stat-card:hover .stat-num{transform:scale(1.05)}
.stat-num.c-accent{color:var(--accent)}.stat-num.c-red{color:var(--red)}.stat-num.c-orange{color:var(--orange)}.stat-num.c-green{color:var(--green)}
.stat-label{font-size:var(--fs-1);color:var(--t3);margin-top:6px;font-weight:500}

/* ===== 筛选 ===== */
.filter-row{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:20px;font-size:var(--fs-2);font-weight:500;color:var(--t2);background:var(--surface);border:1px solid var(--border-2);transition:all var(--t-fast)}
.chip:hover{background:var(--hover);color:var(--t1)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.chip .cnt{font-size:11px;opacity:.75;margin-left:3px}
.toolbar{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-4)}
.tb-label{font-size:var(--fs-1);color:var(--t3);font-weight:500;margin-left:var(--sp-2)}
.tb-label:first-child{margin-left:0}
.sort-sel{padding:6px 32px 6px 12px;border:1px solid var(--border-2);border-radius:var(--r-s);font-size:var(--fs-2);background:var(--surface) url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%238B909A' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E") no-repeat right 11px center;color:var(--t1);cursor:pointer;appearance:none;-webkit-appearance:none;box-shadow:var(--sh-1);transition:border var(--t-fast)}
.sort-sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-line)}
.toolbar .hint{font-size:var(--fs-1);color:var(--t3);margin-left:auto}

/* ===== 结果条 ===== */
.result-bar{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-4);padding:0 2px;font-size:var(--fs-1);color:var(--t3)}
.result-bar b{color:var(--t1);font-weight:600}
.result-bar .rbar{flex:1;height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.result-bar .rbar i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .5s var(--ease)}

/* ===== 区块标题 ===== */
.sec-header{display:flex;align-items:baseline;gap:var(--sp-2);margin:var(--sp-7) 0 var(--sp-4)}
.sec-header h2{font-size:var(--fs-4);font-weight:700;color:var(--t1)}
.sec-header .cnt{font-size:var(--fs-1);color:var(--t3)}

/* ===== 卡片 ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--sh-1);transition:all var(--t);overflow:hidden}
.card:hover{border-color:var(--border-2);box-shadow:var(--sh-2)}

/* ===== 岗位卡 ===== */
.job-list{display:flex;flex-direction:column;gap:var(--sp-3)}
.job-card{padding:var(--sp-5) var(--sp-6);cursor:pointer;position:relative}
.job-card::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:2px;background:transparent;transition:background var(--t)}
.job-card.tier-1::before{background:var(--accent)}
.job-card.tier-2::before{background:var(--orange)}
.job-card.tier-3{opacity:.8}
.job-card:hover{transform:translateY(-1px)}
.job-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);margin-bottom:6px}
.job-title{font-size:var(--fs-4);font-weight:600;color:var(--t1);flex:1;min-width:0;line-height:1.45}
.job-new-tag{display:inline-block;background:var(--accent);color:#fff;padding:1px 7px;border-radius:4px;font-size:9px;font-weight:700;margin-left:8px;vertical-align:middle;letter-spacing:.4px}
.job-match{font-size:var(--fs-1);font-weight:700;padding:3px 10px;border-radius:6px;flex-shrink:0;font-variant-numeric:tabular-nums}
.job-match.t1{background:var(--accent-bg);color:var(--accent)}
.job-match.t2{background:var(--orange-bg);color:var(--orange)}
.job-match.t3{background:var(--surface-2);color:var(--t3)}
.job-row2{display:flex;align-items:center;gap:8px;font-size:var(--fs-1);color:var(--t3);flex-wrap:wrap}
.job-tag{background:var(--surface-2);padding:2px 9px;border-radius:5px;font-size:11px;font-weight:500;color:var(--t2)}
.job-salary{color:var(--orange);font-weight:800;font-size:var(--fs-2);font-variant-numeric:tabular-nums}
.job-date{font-size:11px;color:var(--t2);padding:2px 6px;border-radius:4px;white-space:nowrap}
.job-deadline{color:var(--red);font-weight:600}
.job-src{font-size:11px;color:var(--t3);padding:2px 8px;border:1px dashed var(--border-2);border-radius:5px}
.job-type{font-size:11px;font-weight:600;padding:2px 9px;border-radius:5px}
.jt-xz{color:var(--accent);background:var(--accent-bg)}
.jt-sz{color:var(--t2);background:var(--surface-2)}
.job-status{margin-left:auto;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;cursor:pointer;transition:all var(--t);-webkit-user-select:none}
.job-status:hover{filter:brightness(.95)}
.job-status.s-pending{background:var(--surface-2);color:var(--t2)}
.job-status.s-applied{background:var(--blue-bg);color:var(--blue)}
.job-status.s-interview{background:var(--orange-bg);color:var(--orange)}
.job-status.s-offer{background:var(--green-bg);color:var(--green)}
.job-status.s-reject{background:var(--surface-2);color:var(--t3)}
.job-desc{font-size:var(--fs-2);color:var(--t2);line-height:1.6;margin-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.job-expand{max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.job-card.open .job-expand{max-height:720px}
.job-card.open .job-desc{white-space:normal;-webkit-line-clamp:unset}
.job-detail{margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px dashed var(--border-2);font-size:var(--fs-2);line-height:1.75;color:var(--t2)}
.job-detail b{color:var(--t1);font-weight:600}
.job-detail .tips{color:var(--accent);margin-top:4px}
.job-detail .btns{display:flex;gap:var(--sp-2);margin-top:var(--sp-4);flex-wrap:wrap}
.apply-info{display:flex;align-items:center;gap:8px;margin:var(--sp-3) 0;padding:10px 13px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-s);font-size:var(--fs-2);flex-wrap:wrap}
.apply-info .ai-label{font-size:11px;font-weight:600;color:var(--t3);flex-shrink:0}
.apply-info b{color:var(--t1);font-weight:600;word-break:break-all}
.apply-info a{color:var(--accent);word-break:break-all;font-size:var(--fs-1)}
.apply-info a:hover{text-decoration:underline}
.apply-info .t3{color:var(--t3)}
.ai-copy{margin-left:auto;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);padding:3px 11px;border-radius:5px;flex-shrink:0;transition:background var(--t-fast)}
.ai-copy:hover{background:var(--accent-bg-hover,var(--accent-bg))}

/* ===== 按钮 ===== */
.btn{padding:8px 18px;border-radius:var(--r-s);font-size:var(--fs-2);font-weight:600;cursor:pointer;transition:all var(--t-fast);display:inline-flex;align-items:center;gap:6px;border:none;box-shadow:var(--sh-1)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.secondary{background:var(--surface);color:var(--t1);border:1px solid var(--border-2)}
.btn.secondary:hover{background:var(--hover)}
.btn.disabled{background:var(--surface-2);color:var(--t4);pointer-events:none;border:1px solid var(--border)}

/* ===== 编制卡 ===== */
.bian-list{display:flex;flex-direction:column;gap:var(--sp-3)}
.bian-card{padding:var(--sp-5) var(--sp-6);cursor:pointer}
.bian-card.expired{opacity:.5}
.bian-row1{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-3);margin-bottom:6px}
.bian-row1 h3{font-size:var(--fs-4);font-weight:600;color:var(--t1);flex:1;line-height:1.45}
.bian-countdown{font-size:var(--fs-2);font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.bian-row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.bian-row3{font-size:var(--fs-2);color:var(--t2);line-height:1.55}
.bian-row4{display:flex;justify-content:space-between;align-items:center;margin-top:var(--sp-3)}
.bian-unit{font-size:var(--fs-1);color:var(--t3)}
.bian-expand{max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.bian-card.open .bian-expand{max-height:520px}
.bian-detail{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px dashed var(--border-2);font-size:var(--fs-2);line-height:1.75;color:var(--t2)}

/* ===== 手风琴 ===== */
.accordion{margin-bottom:var(--sp-3)}
.accordion-head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-4) var(--sp-5);cursor:pointer;transition:background var(--t-fast)}
.accordion-head:hover{background:var(--hover)}
.accordion-head h3{font-size:var(--fs-2);font-weight:600;flex:1;color:var(--t1)}
.accordion-head .meta{font-size:var(--fs-1);color:var(--t3)}
.accordion-arrow{color:var(--t3);transition:transform var(--t);font-size:11px}
.accordion.open .accordion-arrow{transform:rotate(180deg)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.accordion.open .accordion-body{max-height:2000px}
.accordion-inner{padding:var(--sp-4) var(--sp-5);font-size:var(--fs-2);line-height:1.9;color:var(--t2);border-top:1px solid var(--border)}
.accordion-inner b{color:var(--t1);font-weight:600}

/* ===== 渠道 ===== */
.ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-3)}

/* ===== 工具 ===== */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function parseDate(str){if(!str)return null;var s=String(str).replace(/[^0-9.]/g,'');if(!s)return null;var p=s.split('.'),n=new Date();if(p.length===2){var a=parseInt(p[0]),b=parseInt(p[1]);if(a>1900)return new Date(a,b-1<0?0:b-1,1);var d=new Date(n.getFullYear(),a-1,b||1);if(d<new Date(n.getFullYear(),n.getMonth()-3,1))d=new Date(n.getFullYear()+1,a-1,b||1);return d}if(p.length===3)return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])||1);return null}
function daysUntil(str){var d=parseDate(str);if(!d)return null;return Math.ceil((d-new Date())/(86400000))}
function isActive(re){var d=parseDate(re);if(!d)return true;return d.getTime()>=new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()).getTime()}
function getTier(m){return m>=85?'tier-1':m>=70?'tier-2':'tier-3'}
function getTierClass(m){return m>=85?'t1':m>=70?'t2':'t3'}
function GS(t){var s;try{s=JSON.parse(ls.z_status||'{}')}catch(e){s={}}return s[t]||'pending'}
function SS(t,st){var s;try{s=JSON.parse(ls.z_status||'{}')}catch(e){s={}}s[t]=st;ls.z_status=JSON.stringify(s)}
function F(){try{return JSON.parse(ls.z_favs||'[]')}catch(e){return[]}}
function TF(t){var f=F(),i=f.indexOf(t);if(i===-1)f.push(t);else f.splice(i,1);ls.z_favs=JSON.stringify(f);return i===-1}
function TS(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(TS._t);TS._t=setTimeout(function(){t.classList.remove('show')},1600)}
function getSeen(){try{return JSON.parse(ls.z_seen||'[]')}catch(e){return[]}}
function getNewJobs(){var seen=getSeen();return JOBS.map(function(j){return j.t}).filter(function(t){return seen.indexOf(t)===-1})}
function updateSeen(){ls.z_seen=JSON.stringify(JOBS.map(function(j){return j.t}))}
function isNew(t){
  var idx=-1;for(var i=0;i<JOBS.length;i++){if(JOBS[i].t===t){idx=i;break}}
  if(idx===-1)return false;
  var d=parseDate(JOBS[idx].pub);
  if(!d)return false;
  var threeDaysAgo=new Date();threeDaysAgo.setDate(threeDaysAgo.getDate()-3);
  threeDaysAgo.setHours(0,0,0,0);
  return d>=threeDaysAgo;
}

function extractEmail(j){var t=(j.jd||'')+' '+(j.tips||'')+' '+(j.desc||'');var m=t.match(/[\w.+-]+@[\w-]+\.[\w.]+/);return m?m[0]:''}
function copyText(txt,msg){
  var ok=function(){TS(msg)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok).catch(function(){fbCopy(txt,msg)})}
  else{fbCopy(txt,msg)}
}
function fbCopy(txt,msg){
  var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');TS(msg)}catch(e){TS('复制失败，请手动复制')}
  document.body.removeChild(ta);
}

  else if(jst)list=list.filter(function(x){return GS(x.t)===jst});
  if(jfav)list=list.filter(function(x){return F().indexOf(x.t)!==-1});
  if(jq){
    var qs=String(jq).toLowerCase().split(/\s+/).filter(Boolean);
    list=list.filter(function(x){
      var hay=(x.t+' '+x.desc+' '+x.city+' '+(x.tags||[]).join(' ')+' '+(x.jd||'')+' '+(x.src||'')).toLowerCase();

  else if(jsrt==='deadline')list.sort(function(a,b){return(a.dead||'99').localeCompare(b.dead||'99')});

/* ===== 备菜 ===== */
function extractMeats(ing){
  var out=[],KEYS=['鸡胸','鸡腿','猪瘦肉','牛肉','猪肉','羊肉','虾','鱼肉'];
  KEYS.forEach(function(k){
    if(String(ing||'').indexOf(k)!==-1){
      var dup=out.some(function(o){return o.indexOf(k)!==-1||k.indexOf(o)!==-1});
      if(!dup)out.push(k);
    }
  });
  return out;
}
function genPrep(){
  var list=[],pl=MEALS.plan||[];
  for(var i=0;i<pl.length-1;i++){
    var today=pl[i],tmr=pl[i+1];
    var meats=extractMeats(tmr.ing);
    if(meats.length){
      list.push({d:today.d,task:'今晚：'+meats.join('、')+'放冷藏解冻（明天周'+tmr.w+'用）'});
    }else{
      list.push({d:today.d,task:'今晚：检查明天（周'+tmr.w+'）'+String(tmr.noon||'').replace(/\+米饭.*$/,'')+'的食材库存'});
    }
  }
  return list;
}
function buildMeals(){
  var m=MEALS,h='';
  var done=m.plan.filter(function(p){return p.done}).length,total=m.plan.length||1;
  var wk=[];
  if(m.plan.length){wk.push(m.plan[0].d);if(m.plan.length>1)wk.push(m.plan[m.plan.length-1].d)}
  /* 本周采购：汇总菜单食材并去重 */
  var ingMap={},ingList=[];
  m.plan.forEach(function(p){
    String(p.ing||'').split(/[、,，;；/\/]/).forEach(function(x){
      x=String(x).trim().replace(/\s+/g,'');
      if(!x||x==='—'||x==='-'||x==='无')return;
      if(!ingMap[x]){ingMap[x]=1;ingList.push(x)}
    });
  });
  /* 合并同类食材不同数量（青椒2个+青椒3个→青椒5个） */
  var merged=[];
  ingList.forEach(function(x){
    var m=x.match(/^([\u4e00-\u9fa5a-zA-Z]+)(\d+[g个根块盒把颗片瓣条]|半[个根盒])$/);
    if(!m){merged.push(x);return}
    var base=m[1], qty=parseInt(m[2])||1, unit=m[2].replace(/\d+/g,'');
    for(var k=0;k<merged.length;k++){
      var mk=merged[k].match(/^([\u4e00-\u9fa5a-zA-Z]+)(\d+)([g个根块盒把颗片瓣条])$/);
      if(mk&&mk[1]===base&&mk[3]===unit){
        merged[k]=base+(parseInt(mk[2])+qty)+unit;return;
      }
    }
    merged.push(x);
  });
  ingList=merged;
  var shopDone=[];try{shopDone=JSON.parse(ls.zq_shop||'[]')}catch(e){}
  /* 采购预算估算（叮咚买菜参考单价） */
  var PRICE_MAP=[
    {k:'鸡胸',p:8},{k:'鸡腿',p:7},{k:'猪瘦肉',p:9},{k:'牛肉',p:18},{k:'牛里脊',p:14},
    {k:'猪肉',p:10},{k:'羊肉',p:16},{k:'虾',p:12},{k:'鱼肉',p:10},
    {k:'鸡蛋',p:3},{k:'番茄',p:3},{k:'洋葱',p:1.5},{k:'土豆',p:2},{k:'胡萝卜',p:1.5},
    {k:'豇豆',p:4},{k:'青椒',p:3},{k:'西葫芦',p:2},{k:'西兰花',p:4},{k:'木耳',p:2},
    {k:'姜',p:1},{k:'咖喱',p:3},{k:'豆腐',p:3},{k:'口蘑',p:5},{k:'芹菜',p:3},
    {k:'葱',p:1},{k:'蒜',p:1},{k:'米',p:5},{k:'生抽',p:2},{k:'老抽',p:2},{k:'蚝油',p:2},{k:'淀粉',p:1}
  ];
  var estTotal=0,estCount=0;
  ingList.forEach(function(x){
    for(var i=0;i<PRICE_MAP.length;i++){
      if(x.indexOf(PRICE_MAP[i].k)!==-1){estTotal+=PRICE_MAP[i].p;estCount++;break}
    }
  });

function toggleMealFold(id){

  var s={};try{s=JSON.parse(ls.zq_meal_fold||'{}')}catch(e){}
  s[id]=folded;

}
function initMealFold(){
  var s={};try{s=JSON.parse(ls.zq_meal_fold||'{}')}catch(e){}

/* ===== 拖拽 ===== */
var drag={el:null,idx:-1,arr:'',startY:0,timer:null,active:false,placeholder:null,daySeq:null};
function initDrag(){['mealPlan','mealPrep','mealRecipes'].forEach(function(id){var c=document.getElementById(id);if(c)c.addEventListener('pointerdown',dragStart)})}
document.addEventListener('pointermove',dragMove);
document.addEventListener('pointerup',dragEnd);
document.addEventListener('pointercancel',dragEnd);
function dragStart(e){
  var item=e.target.closest('[data-draggable]');if(!item)return;
  if(e.target.closest('input,button,[contenteditable],.meal-check'))return;
  drag.startY=e.clientY;drag.idx=parseInt(item.dataset.idx);drag.arr=item.dataset.arr;
  drag.daySeq=(drag.arr==='plan'&&MEALS.plan)?MEALS.plan.map(function(p){return {d:p.d,w:p.w}}):null;
  drag.timer=setTimeout(function(){
    drag.active=true;drag.el=item;
    var rect=item.getBoundingClientRect();
    drag.placeholder=document.createElement('div');drag.placeholder.className='drag-placeholder';drag.placeholder.style.height=rect.height+'px';
    item.parentNode.insertBefore(drag.placeholder,item);
    item.classList.add('dragging');item.style.width=rect.width+'px';item.style.position='fixed';item.style.zIndex='999';
    item.style.left=rect.left+'px';item.style.top=rect.top+'px';item.style.pointerEvents='none';
    e.preventDefault();
  },180);
}
function dragMove(e){
  if(!drag.active||!drag.el)return;e.preventDefault();
  var dy=e.clientY-drag.startY;drag.el.style.transform='translateY('+dy+'px) scale(1.02)';
  var container=drag.el.parentNode,items=container.querySelectorAll('[data-draggable]:not(.dragging)');
  for(var i=0;i<items.length;i++){var rect=items[i].getBoundingClientRect();if(e.clientY<rect.top+rect.height/2){if(drag.placeholder!==items[i])container.insertBefore(drag.placeholder,items[i]);return}}
  var last=items[items.length-1];if(last&&drag.placeholder!==last.nextSibling)container.insertBefore(drag.placeholder,last.nextSibling);
}
function dragEnd(e){
  clearTimeout(drag.timer);if(!drag.active||!drag.el){drag.active=false;drag.el=null;return}
  var container=drag.el.parentNode,newIdx=Array.prototype.indexOf.call(container.children,drag.placeholder);
  drag.el.classList.remove('dragging');drag.el.style='';
  if(drag.placeholder){container.insertBefore(drag.el,drag.placeholder);drag.placeholder.remove();drag.placeholder=null}
  if(newIdx>=0&&newIdx!==drag.idx&&MEALS[drag.arr]){
    var oldIdx=drag.idx,item=MEALS[drag.arr].splice(oldIdx,1)[0],adj=newIdx>oldIdx?newIdx-1:newIdx;
    MEALS[drag.arr].splice(adj,0,item);
    if(drag.arr==='plan'&&drag.daySeq){MEALS.plan.forEach(function(p,i){if(drag.daySeq[i]){p.d=drag.daySeq[i].d;p.w=drag.daySeq[i].w}})}
    saveMeals();TS(drag.arr==='plan'?'已调整菜单（日期重新分配）':'已调整顺序');buildMeals();
  }
  drag.active=false;drag.el=null;
}

function animateNum(el,target){
  var dur=650,start=0,t0=null;
  function step(ts){if(!t0)t0=ts;var p=Math.min((ts-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(start+(target-start)*e);if(p<1)requestAnimationFrame(step)}
  requestAnimationFrame(step);
}
