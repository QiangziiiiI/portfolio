<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>私密空间 — 入口</title>
<style>
:root{
  --spring-soft:cubic-bezier(0.22,0.61,0.36,1);
  --spring-bouncy:cubic-bezier(0.34,1.56,0.64,1);
  --blue:#0071e3;
  --blue-soft:#0A84FF;
  --text:#1d1d1f;
  --text-secondary:#86868b;
  --bg:#fbfbfd;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
  background:
    radial-gradient(ellipse 70% 50% at 30% 20%,rgba(10,132,255,0.06) 0%,transparent 60%),
    radial-gradient(ellipse 60% 60% at 70% 80%,rgba(120,60,240,0.04) 0%,transparent 60%),
    var(--bg);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
  padding:20px;
}

.card{
  width:100%;max-width:380px;
  background:
    linear-gradient(180deg,rgba(255,255,255,0.1) 0%,rgba(255,255,255,0.0) 40%,rgba(255,255,255,0.04) 100%),
    rgba(255,255,255,0.55);
  backdrop-filter:blur(50px) saturate(200%);
  -webkit-backdrop-filter:blur(50px) saturate(200%);
  border:0.5px solid rgba(0,0,0,0.06);
  border-radius:28px;
  padding:44px 32px 36px;
  box-shadow:
    inset 0 0.5px 0 rgba(255,255,255,0.6),
    0 20px 60px rgba(0,0,0,0.06);
  text-align:center;
  opacity:0;transform:translateY(20px) scale(0.98);
  animation:enter 0.7s var(--spring-soft) 0.05s forwards;
}
@keyframes enter{
  0%{opacity:0;transform:translateY(20px) scale(0.98)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

.lock-icon{
  width:64px;height:64px;
  margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(10,132,255,0.12),rgba(94,92,230,0.1));
  border-radius:18px;
  font-size:30px;
}

h1{
  font-size:22px;font-weight:680;letter-spacing:-0.5px;
  margin-bottom:6px;
}
.sub{
  font-size:13px;color:var(--text-secondary);margin-bottom:28px;
  line-height:1.55;
}

form{display:flex;flex-direction:column;gap:14px}
.input-wrap{
  position:relative;
  display:flex;align-items:center;
  background:rgba(255,255,255,0.6);
  border:1px solid rgba(0,0,0,0.08);
  border-radius:14px;
  transition:all 0.3s var(--spring-bouncy);
}
.input-wrap:focus-within{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(0,113,227,0.1);
  background:white;
}
.input-wrap input{
  flex:1;
  border:none;background:transparent;
  font-size:15px;font-family:inherit;
  padding:14px 18px;outline:none;
  letter-spacing:2px;color:var(--text);
  -webkit-text-security:disc;
}
.toggle{
  background:none;border:none;
  padding:0 16px;
  cursor:pointer;color:var(--text-secondary);
  font-size:12px;font-weight:540;
  letter-spacing:0;
  font-family:inherit;
}
.toggle:hover{color:var(--text)}

.submit{
  margin-top:6px;
  display:flex;align-items:center;justify-content:center;
  padding:14px 24px;
  background:linear-gradient(135deg,rgba(10,132,255,0.92),rgba(0,113,227,0.95));
  color:white;font-size:15px;font-weight:560;
  font-family:inherit;
  border:0.5px solid rgba(255,255,255,0.25);
  border-radius:14px;cursor:pointer;
  box-shadow:inset 0 0.5px 0 rgba(255,255,255,0.25),0 4px 16px rgba(0,113,227,0.18);
  transition:all 0.35s var(--spring-bouncy);
  letter-spacing:0.3px;
}
.submit:hover:not(:disabled){
  transform:scale(1.02);
  box-shadow:inset 0 0.5px 0 rgba(255,255,255,0.3),0 8px 24px rgba(0,113,227,0.28);
}
.submit:active:not(:disabled){transform:scale(0.98)}
.submit:disabled{opacity:0.5;cursor:not-allowed}

.status{
  min-height:18px;
  font-size:13px;color:#ff453a;
  margin-top:14px;
  opacity:0;transform:translateY(4px);
  transition:all 0.3s var(--spring-bouncy);
}
.status.show{opacity:1;transform:translateY(0)}
.status.success{color:#34c759}

.hint{
  margin-top:22px;
  font-size:11px;color:var(--text-secondary);
  letter-spacing:0.3px;
  opacity:0.7;
}

.back{
  position:fixed;top:20px;left:20px;
  font-size:13px;color:var(--text-secondary);
  text-decoration:none;
  padding:8px 14px;
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:0.5px solid rgba(0,0,0,0.06);
  border-radius:980px;
  transition:all 0.3s var(--spring-bouncy);
}
.back:hover{background:rgba(255,255,255,0.8);color:var(--text)}
</style>
</head>
<body>

<a href="../" class="back">← 返回</a>

<div class="card">
  <div class="lock-icon">🔒</div>
  <h1>私密空间</h1>
  <p class="sub">请输入访问密码</p>

  <form id="form" autocomplete="off">
    <div class="input-wrap">
      <input type="password" id="pwd" placeholder="密码" required autofocus>
      <button type="button" class="toggle" id="toggle">显示</button>
    </div>
    <button type="submit" class="submit" id="submit">进入 →</button>
  </form>

  <p class="status" id="status"></p>
  <p class="hint">会话有效期 1 小时 · 失败请刷新重试</p>
</div>

<script>
const form = document.getElementById('form');
const pwd = document.getElementById('pwd');
const toggle = document.getElementById('toggle');
const submit = document.getElementById('submit');
const status = document.getElementById('status');

toggle.onclick = () => {
  const showing = pwd.type === 'text';
  pwd.type = showing ? 'password' : 'text';
  toggle.textContent = showing ? '显示' : '隐藏';
  pwd.focus();
};

function setStatus(msg, ok = false) {
  status.textContent = msg;
  status.classList.add('show');
  status.classList.toggle('success', ok);
  if (ok) {
    setTimeout(() => status.classList.remove('show'), 2000);
  }
}

let locked = false;
let fails = 0;
let lockUntil = 0;

form.onsubmit = async (e) => {
  e.preventDefault();
  if (locked && Date.now() < lockUntil) {
    const sec = Math.ceil((lockUntil - Date.now()) / 1000);
    setStatus(`已锁定，请 ${sec} 秒后重试`);
    return;
  }
  if (locked && Date.now() >= lockUntil) {
    locked = false;
    fails = 0;
  }

  const password = pwd.value.trim();
  if (!password) return;

  submit.disabled = true;
  submit.textContent = '验证中…';

  try {
    const r = await fetch('/api/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password}),
      credentials: 'same-origin',
    });

    if (r.ok) {
      setStatus('✓ 验证成功，正在进入…', true);
      // 立即跳转到示例页（实际内容由你自由扩展 /secret/*.html）
      setTimeout(() => { window.location.href = '/secret/diary.html'; }, 400);
      return;
    }

    const data = await r.json().catch(() => ({}));
    fails++;

    if (fails >= 5) {
      locked = true;
      lockUntil = Date.now() + 60000; // 1分钟锁定
      setStatus('尝试过多，已锁定 1 分钟');
    } else {
      setStatus(data.error || '密码错误');
    }

    pwd.select();
  } catch (err) {
    setStatus('网络异常，请重试');
  } finally {
    submit.disabled = false;
    submit.textContent = '进入 →';
  }
};

// Enter key behavior
pwd.addEventListener('keydown', e => {
  if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
});
</script>

</body>
</html>
